<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 466 466" width="466" height="466" role="img" aria-label="表盘：1 2 3 4 四个点，外圈是电量">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#16181e"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="dusk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a3a58"/>
      <stop offset="40%" stop-color="#4a8f9a"/>
      <stop offset="75%" stop-color="#d2c2a8"/>
      <stop offset="100%" stop-color="#8a6e7a"/>
    </linearGradient>
  </defs>
  <circle cx="233" cy="233" r="233" fill="#000"/>
  <circle cx="233" cy="233" r="226" fill="url(#bg)"/>
  <!-- 电量底槽 -->
  <circle cx="233" cy="233" r="218" fill="none" stroke="#1c1c20" stroke-width="14"/>
  <!-- 电量约 78%，从 12 点顺时针 -->
  <circle cx="233" cy="233" r="218" fill="none" stroke="url(#dusk)" stroke-width="14"
          stroke-linecap="round"
          stroke-dasharray="1066 1367"
          transform="rotate(-90 233 233)"/>
  <text x="233" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c8c2b4">电量 78%</text>

  <!-- 1 12点 蓝 -->
  <circle cx="233" cy="72" r="36" fill="#466ed0"/>
  <circle cx="233" cy="72" r="40" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="233" y="83" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="30" fill="#e8f0ff">1</text>
  <!-- 2 3点 绿 -->
  <circle cx="394" cy="233" r="36" fill="#24c458"/>
  <text x="394" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="30" fill="#dcffe6">2</text>
  <!-- 3 6点 黄 -->
  <circle cx="233" cy="394" r="36" fill="#ff9f0a"/>
  <text x="233" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="30" fill="#fff">3</text>
  <!-- 4 9点 灰 -->
  <circle cx="72" cy="233" r="36" fill="#343438"/>
  <text x="72" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="30" fill="#98989d">4</text>

  <text x="233" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#8eb0ff" letter-spacing="2">RUN</text>
  <text x="233" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#9aa0a8">1 在跑</text>
</svg>
